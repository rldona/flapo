name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Para poder lanzarlo a mano sin inventarse un commit vacío.
  workflow_dispatch:

# El repositorio da permisos de solo lectura por defecto, así que el token
# no puede crear releases a menos que se le pida. Sin esto, el job de
# release falla con un 403 **solo el día que se pone un tag**, que es el peor
# momento posible para descubrirlo.
#
# Se declara el mínimo arriba y la escritura solo en el job que la necesita.
permissions:
  contents: read

# Dos pushes seguidos a main lanzaban dos workflows enteros. Se cancela el
# anterior... salvo en tags: cancelar una release a medias dejaría artefactos
# a medio subir.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Debe coincidir con docs/environment.md y con la imagen de godot-ci.
  GODOT_VERSION: "4.7.2"
  PROJECT_NAME: flapo

jobs:
  # Lo que hace que `main` sea siempre exportable: si esto pasa en verde,
  # el juego compila, se comporta y produce un build.
  test:
    name: Tests headless y export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4

      # Genera .godot/ (registro de class_name incluido). Sin esto los
      # scripts que nombran GameConfig no compilan: ver ADR-0009.
      - name: Importar assets
        run: godot --headless --path . --import

      - name: Comprobaciones headless
        run: GODOT="$(command -v godot)" ./tests/run.sh

      # Un fallo de export no se ve jugando en el editor y revienta justo en
      # la release. Aquí se detecta en cada push.
      # La imagen godot-ci instala las plantillas en /root, pero GitHub
      # Actions ejecuta el contenedor con HOME=/github/home, así que Godot
      # las busca donde no están. Se copian antes de exportar.
      - name: Colocar las export templates
        run: |
          DEST="$HOME/.local/share/godot/export_templates"
          mkdir -p "$DEST"
          for SRC in /root/.local/share/godot/export_templates/*/; do
            [ -d "$SRC" ] || continue
            cp -r "$SRC" "$DEST/"
          done
          ls -1 "$DEST"

      - name: Export Web
        run: |
          mkdir -p export/Web
          godot --headless --path . --export-release "Web" export/Web/index.html
          test -s export/Web/index.wasm

      # Nombre con sufijo `-ci` a propósito: este build es para mirar una PR,
      # no para publicar. El job de release descarga por patrón y sin esta
      # distinción se colaba en la release un segundo zip del mismo Web.
      - name: Guardar el build web
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-web-ci
          path: export/Web
          retention-days: 7

  # Estilo. Bloquea desde T-083: el mismo pre-commit que corre en local.
  lint:
    name: Formato y lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: pre-commit/action@v3.0.1

  # Solo en tags. Android queda fuera hasta T-092: su export de release
  # necesita un keystore que vive como secreto de GitHub, nunca en el repo.
  export:
    name: Exportar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    strategy:
      matrix:
        preset: [Web, Linux, Windows]
    steps:
      - uses: actions/checkout@v4
      - name: Importar assets
        run: godot --headless --path . --import
      # La imagen godot-ci instala las plantillas en /root, pero GitHub
      # Actions ejecuta el contenedor con HOME=/github/home, así que Godot
      # las busca donde no están. Se copian antes de exportar.
      - name: Colocar las export templates
        run: |
          DEST="$HOME/.local/share/godot/export_templates"
          mkdir -p "$DEST"
          for SRC in /root/.local/share/godot/export_templates/*/; do
            [ -d "$SRC" ] || continue
            cp -r "$SRC" "$DEST/"
          done
          ls -1 "$DEST"

      - name: Export ${{ matrix.preset }}
        run: |
          mkdir -p export/${{ matrix.preset }}
          case "${{ matrix.preset }}" in
            Web)     out=export/Web/index.html ;;
            Android) out=export/Android/${PROJECT_NAME}.apk ;;
            Linux)   out=export/Linux/${PROJECT_NAME}.x86_64 ;;
            Windows) out=export/Windows/${PROJECT_NAME}.exe ;;
          esac
          godot --headless --path . --export-release "${{ matrix.preset }}" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-release-${{ matrix.preset }}
          path: export/${{ matrix.preset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    # El único job que escribe fuera: crea la release y sube los zips.
    permissions:
      contents: write
    steps:
      # Por patrón, no todo: sin filtro se descargaba también el build de CI
      # y la release salía con dos Web, uno de ellos el de mirar la PR.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ${{ env.PROJECT_NAME }}-release-*
      - run: cd artifacts && for d in */; do zip -r "${d%/}.zip" "$d"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
