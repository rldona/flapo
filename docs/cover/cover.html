<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Portada del repositorio / social preview de GitHub (1280x640): icono, nombre y el juego en un
     móvil. La genera tools/hacer_portada.sh en cover.png. La carpeta lleva .gdignore para que Godot
     no importe estas imágenes ni las meta en el build. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: #fff; position: relative;
    background:
      radial-gradient(900px 600px at 105% 105%, rgba(230, 184, 74, .40), transparent 62%),
      radial-gradient(700px 500px at -10% -20%, rgba(120, 176, 216, .30), transparent 60%),
      linear-gradient(135deg, #0d1822 0%, #16293a 60%, #1a2430 100%);
  }
  .brand { position: absolute; left: 76px; top: 86px; width: 640px; }
  .icon {
    width: 132px; height: 132px; display: block; border-radius: 30px; image-rendering: pixelated;
    filter: drop-shadow(0 14px 28px rgba(0, 0, 0, .45));
  }
  h1 { font-size: 92px; line-height: 1; letter-spacing: -2.5px; margin-top: 34px; font-weight: 800; }
  .tag { font-size: 32px; line-height: 1.3; margin-top: 22px; color: #f5e3b0; font-weight: 500; }
  .chips { display: flex; flex-wrap: nowrap; gap: 8px; margin-top: 34px; white-space: nowrap; }
  .chip { font-size: 17px; padding: 6px 13px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.28); background: rgba(255,255,255,.07); color: #eef4f9; }
  /* Marco de móvil: el juego es vertical (288x512). */
  .shot {
    position: absolute; left: 860px; top: 40px; width: 330px; border-radius: 42px; overflow: hidden;
    padding: 12px; background: #050607; transform: rotate(4deg);
    box-shadow: 0 40px 80px rgba(0, 0, 0, .6), 0 0 0 1.5px rgba(255, 255, 255, .14);
  }
  .shot img { display: block; width: 100%; border-radius: 30px; image-rendering: pixelated; }
</style>
</head>
<body>
  <div class="brand">
    <img class="icon" src="../../assets/sprites/icon_app.png" alt="Icono de Flapo">
    <h1>Flapo</h1>
    <p class="tag">Toca para aletear.<br>Y no toques nada.</p>
    <div class="chips">
      <span class="chip">Código abierto</span><span class="chip">Godot 4</span><span class="chip">Pixel art</span><span class="chip">En el navegador</span>
    </div>
  </div>
  <div class="shot">
    <img src="screenshot.png" alt="Flapo">
  </div>
</body>
</html>
